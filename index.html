document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

1fc2fe431\" alt=\"MedON\" style=\"position:absolute;width:149px;left:-8px;top:-49px;mix-blend-mode:multiply\">\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:2px;padding-left:16px;border-left:1px solid #D3E4DC;min-width:0\">\n        <span style=\"font-size:17px;font-weight:700;color:#04302B;line-height:1.2\">Semiología cardiovascular<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:#1D8446\">STUDENT · SEMIOLOGÍA<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fa>\n  <\u002Fdiv>\n  <nav aria-label=\"Capítulos\" style=\"border-top:1px solid #EAF6EE;overflow-x:auto;scrollbar-width:none\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:0 10px;display:flex;gap:2px\">\n      <sc-for list=\"{{ nav }}\" as=\"c\" hint-placeholder-count=\"8\">\n        <button sc-camel-on-click=\"{{ c.go }}\" style=\"border:0;background:transparent;padding:9px 11px;cursor:pointer;white-space:nowrap;font-size:14px;font-weight:{{ c.fw }};color:{{ c.fg }};box-shadow:inset 0 -2px 0 {{ c.bar }}\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;margin-right:6px;opacity:.7\">{{ c.n }}<\u002Fspan>{{ c.t }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fnav>\n  <div style=\"position:absolute;left:0;bottom:-1px;height:3px;background:#3CC168;width:{{ prog }}\"><\u002Fdiv>\n<\u002Fheader>\n\n<section style=\"background:#04302B;color:#F1F8F6\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:48px 16px 44px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:36px;align-items:center\">\n    <div>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;color:#3CC168\">SEMIOLOGÍA CLÍNICA · APARATO CARDIOVASCULAR<\u002Fdiv>\n      <h1 style=\"font-size:clamp(36px,5.4vw,62px);font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:12px 0 14px\">Semiología <span style=\"color:#3CC168\">cardiovascular<\u002Fspan><\u002Fh1>\n      <p style=\"max-width:52ch;opacity:.88;font-size:18px\">Inspección, palpación, percusión y auscultación del corazón. Escucha los ruidos y soplos, ubica los focos y reconoce cada valvulopatía.<\u002Fp>\n      <div style=\"margin-top:22px;display:flex;gap:10px;flex-wrap:wrap\">\n        <button sc-camel-on-click=\"{{ goVal }}\" style=\"border:0;background:#3CC168;color:#04302B;font-weight:700;padding:12px 18px;border-radius:12px;cursor:pointer\">Escuchar soplos<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goFoc }}\" style=\"border:1px solid rgba(255,255,255,.3);background:transparent;color:#F1F8F6;font-weight:600;padding:12px 18px;border-radius:12px;cursor:pointer\">Focos de auscultación<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goQuiz }}\" style=\"border:1px solid rgba(255,255,255,.3);background:transparent;color:#F1F8F6;font-weight:600;padding:12px 18px;border-radius:12px;cursor:pointer\">Practicar<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:20px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;color:#3CC168\">CICLO CARDIACO · R1 – SÍSTOLE – R2 – DIÁSTOLE<\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-end;gap:2px;height:70px;margin-top:16px\">\n        <sc-for list=\"{{ heroBars }}\" as=\"b\" hint-placeholder-count=\"40\">\n          <span style=\"flex:1;border-radius:2px;height:{{ b.h }};background:{{ b.c }}\"><\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:10% 35% 10% 45%;font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:.8;margin-top:6px\"><span>R1<\u002Fspan><span>SÍSTOLE<\u002Fspan><span>R2<\u002Fspan><span>DIÁSTOLE<\u002Fspan><\u002Fdiv>\n      <button sc-camel-on-click=\"{{ heroPlay }}\" style=\"margin-top:16px;border:0;background:#3CC168;color:#04302B;font-weight:700;padding:10px 16px;border-radius:12px;cursor:pointer;display:flex;gap:10px;align-items:center\"><span style=\"width:10px;height:10px;border-radius:50%;background:#04302B;animation:{{ heroAnim }}\"><\u002Fspan>{{ heroLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<main style=\"max-width:1180px;margin:0 auto;padding:8px 16px 64px\">\n\n  <section id=\"inspeccion\" style=\"padding-top:44px\">\n    <div style=\"display:flex;gap:16px;align-items:baseline;border-bottom:2px solid #04302B;padding-bottom:12px;margin-bottom:22px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:34px;color:#1D8446;line-height:1\">01<\u002Fspan>\n      <div><h2 style=\"font-size:clamp(25px,3.2vw,34px);font-weight:700\">Inspección<\u002Fh2><p style=\"color:#4A6660;font-size:15px\">Decúbito supino a 30–45°, tórax descubierto, luz tangencial para captar movimientos sutiles<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px;align-items:start\">\n      <div style=\"display:grid;gap:8px\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;color:#1D8446;display:flex;align-items:center;gap:8px\"><span style=\"width:8px;height:8px;border-radius:50%;background:#1D8446\"><\u002Fspan>PRECORDIO<\u002Fdiv>\n        <sc-for list=\"{{ inspA }}\" as=\"i\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ i.pick }}\" style=\"text-align:left;border:1px solid {{ i.bd }};background:{{ i.bg }};color:{{ i.fg }};border-radius:12px;padding:11px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center\"><b style=\"font-weight:600\">{{ i.t }}<\u002Fb><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;opacity:.7\">{{ i.seen }}<\u002Fspan><\u002Fbutton>\n        <\u002Fsc-for>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;color:#1D8446;display:flex;align-items:center;gap:8px;margin-top:10px\"><span style=\"width:8px;height:8px;border-radius:50%;border:2px solid #1D8446\"><\u002Fspan>SIGNOS GENERALES ASOCIADOS<\u002Fdiv>\n        <sc-for list=\"{{ inspB }}\" as=\"i\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ i.pick }}\" style=\"text-align:left;border:1px solid {{ i.bd }};background:{{ i.bg }};color:{{ i.fg }};border-radius:12px;padding:11px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center\"><b style=\"font-weight:600\">{{ i.t }}<\u002Fb><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;opacity:.7\">{{ i.seen }}<\u002Fspan><\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #D3E4DC;border-radius:18px;padding:22px;min-width:0\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;color:#1D8446\">{{ ins.cat }}<\u002Fdiv>\n        <h3 style=\"font-size:24px;font-weight:800;margin-top:4px\">{{ ins.t }}<\u002Fh3>\n        <p style=\"margin-top:8px;color:#4A6660\">{{ ins.d }}<\u002Fp>\n        <div style=\"display:grid;gap:6px;margin-top:14px\">\n          <sc-for list=\"{{ ins.rows }}\" as=\"r\" hint-placeholder-count=\"3\">\n            <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px;background:#F4F8F6;border-radius:10px;padding:10px 12px;font-size:15px\"><b style=\"font-weight:600\">{{ r.0 }}<\u002Fb><span style=\"color:#2A4A44\">{{ r.1 }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"palpacion\" style=\"padding-top:52px\">\n    <div style=\"display:flex;gap:16px;align-items:baseline;border-bottom:2px solid #04302B;padding-bottom:12px;margin-bottom:22px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:34px;color:#1D8446;line-height:1\">02<\u002Fspan>\n      <div><h2 style=\"font-size:clamp(25px,3.2vw,34px);font-weight:700\">Palpación<\u002Fh2><p style=\"color:#4A6660;font-size:15px\">Con la palma y la base de los dedos: choque de punta, frémitos y latidos anormales<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px\">\n      <div style=\"background:#fff;border:1px solid #D3E4DC;border-radius:18px;padding:22px\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;color:#1D8446\">CHOQUE DE PUNTA · ¿CÓMO LO ENCONTRASTE?<\u002Fdiv>\n        <sc-for list=\"{{ apexQs }}\" as=\"q\" hint-placeholder-count=\"3\">\n          <div style=\"margin-top:14px\">\n            <div style=\"font-weight:600;font-size:15px\">{{ q.t }}<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:6px\">\n              <sc-for list=\"{{ q.opts }}\" as=\"o\" hint-placeholder-count=\"2\">\n                <button sc-camel-on-click=\"{{ o.pick }}\" style=\"border:1px solid {{ o.bd }};background:{{ o.bg }};color:{{ o.fg }};padding:7px 12px;border-radius:10px;cursor:pointer;font-size:14.5px\">{{ o.t }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"margin-top:16px;border-radius:14px;padding:16px;background:{{ apex.bg }}\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;color:{{ apex.fg }}\">{{ apex.tag }}<\u002Fdiv>\n          <div style=\"font-size:21px;font-weight:800;margin-top:2px\">{{ apex.t }}<\u002Fdiv>\n          <p style=\"font-size:15.5px;margin-top:4px\">{{ apex.d }}<\u002Fp>\n        <\u002Fdiv>\n        <p style=\"font-size:13px;color:#4A6660;margin-top:10px\">Normal: 5.º EIC, línea medioclavicular izquierda · ≤ 2–2,5 cm (una yema) · breve, primera mitad de la sístole.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #D3E4DC;border-radius:18px;padding:22px;min-width:0\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;color:#1D8446\">FRÉMITOS Y OTROS LATIDOS<\u002Fdiv>\n        <div style=\"display:grid;gap:6px;margin-top:12px\">\n          <div style=\"background:#F4F8F6;border-radius:10px;padding:10px 12px;font-size:15px\"><b style=\"font-weight:600\">Frémito<\u002Fb> <span style=\"color:#2A4A44\">equivalente palpatorio de un soplo (grado ≥ IV/VI), «ronroneo de gato».<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#F4F8F6;border-radius:10px;padding:10px 12px;font-size:15px\"><b style=\"font-weight:600\">Frémito diastólico en ápex<\u002Fb> <span style=\"color:#2A4A44\">estenosis mitral.<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#F4F8F6;border-radius:10px;padding:10px 12px;font-size:15px\"><b style=\"font-weight:600\">Frémito sistólico en foco aórtico<\u002Fb> <span style=\"color:#2A4A44\">estenosis aórtica.<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#F4F8F6;border-radius:10px;padding:10px 12px;font-size:15px\"><b style=\"font-weight:600\">Impulso paraesternal izquierdo<\u002Fb> <span style=\"color:#2A4A44\">hipertrofia o dilatación del VD.<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#F4F8F6;border-radius:10px;padding:10px 12px;font-size:15px\"><b style=\"font-weight:600\">P2 palpable<\u002Fb> <span style=\"color:#2A4A44\">hipertensión pulmonar.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"percusion\" style=\"padding-top:52px\">\n    <div style=\"display:flex;gap:16px;align-items:baseline;border-bottom:2px solid #04302B;padding-bottom:12px;margin-bottom:22px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:34px;color:#1D8446;line-height:1\">03<\u002Fspan>\n      <div><h2 style=\"font-size:clamp(25px,3.2vw,34px);font-weight:700\">Percusión<\u002Fh2><p style=\"color:#4A6660;font-size:15px\">Valor limitado, no abandonado · de fuera hacia adentro, de lo sonoro a lo mate<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px\">\n      <div style=\"background:#fff;border:1px solid #D3E4DC;border-radius:16px;padding:18px\">\n        <h3 style=\"font-size:19px;font-weight:700\">Matidez cardiaca<\u002Fh3>\n        <div style=\"display:grid;gap:6px;margin-top:10px\">\n          <div style=\"background:#F4F8F6;border-radius:10px;padding:10px 12px;font-size:15px\"><b>Relativa:<\u002Fb> límite real del corazón, cubierto por pulmón.<\u002Fdiv>\n          <div style=\"background:#F4F8F6;border-radius:10px;padding:10px 12px;font-size:15px\"><b>Absoluta:<\u002Fb> zona en contacto directo con la pared.<\u002Fdiv>\n          <div style=\"background:#F4F8F6;border-radius:10px;padding:10px 12px;font-size:15px\">El borde derecho normal no rebasa el borde esternal derecho.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #D3E4DC;border-radius:16px;padding:18px\">\n        <h3 style=\"font-size:19px;font-weight:700\">Utilidad clínica<\u002Fh3>\n        <div style=\"display:grid;gap:6px;margin-top:10px\">\n          <div style=\"background:#F4F8F6;border-radius:10px;padding:10px 12px;font-size:15px\"><b>Cardiomegalia:<\u002Fb> área de matidez ampliada.<\u002Fdiv>\n          <div style=\"background:#F4F8F6;border-radius:10px;padding:10px 12px;font-size:15px\"><b>Derrame pericárdico:<\u002Fb> matidez que cambia con la posición.<\u002Fdiv>\n          <div style=\"background:#F4F8F6;border-radius:10px;padding:10px 12px;font-size:15px\"><b>Dextrocardia:<\u002Fb> matidez en el hemitórax derecho.<\u002Fdiv>\n          <div style=\"background:#F4F8F6;border-radius:10px;padding:10px 12px;font-size:15px\"><b>Enfisema:<\u002Fb> matidez reducida, corazón «pequeño y vertical».<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"auscultacion\" style=\"padding-top:52px\">\n    <div style=\"display:flex;gap:16px;align-items:baseline;border-bottom:2px solid #04302B;padding-bottom:12px;margin-bottom:22px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:34px;color:#1D8446;line-height:1\">04<\u002Fspan>\n      <div><h2 style=\"font-size:clamp(25px,3.2vw,34px);font-weight:700\">Auscultación<\u002Fh2><p style=\"color:#4A6660;font-size:15px\">El pilar del examen · ambiente silencioso, usa audífonos<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px\">\n      <div style=\"background:#fff;border:1px solid #D3E4DC;border-radius:16px;padding:16px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#1D8446;letter-spacing:.1em\">CAMPANA · PRESIÓN SUAVE<\u002Fdiv><p style=\"margin-top:6px;font-size:15.5px\">Baja frecuencia: R3, R4 y el retumbo de la estenosis mitral.<\u002Fp><\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #D3E4DC;border-radius:16px;padding:16px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#1D8446;letter-spacing:.1em\">MEMBRANA · PRESIÓN FIRME<\u002Fdiv><p style=\"margin-top:6px;font-size:15.5px\">Alta frecuencia: R1, R2, clics y soplos de regurgitación.<\u002Fp><\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #D3E4DC;border-radius:16px;padding:16px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#1D8446;letter-spacing:.1em\">POSICIONES<\u002Fdiv><p style=\"margin-top:6px;font-size:15.5px\">Decúbito lateral izquierdo: ruidos mitrales. Sentado, inclinado y en espiración: ruidos aórticos.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px;margin-top:16px\">\n      <sc-for list=\"{{ heart }}\" as=\"s\" hint-placeholder-count=\"3\">\n        <div style=\"background:#fff;border:1px solid {{ s.bd }};border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;gap:12px;align-items:center\">\n            <button sc-camel-on-click=\"{{ s.play }}\" aria-label=\"{{ s.aria }}\" style=\"width:48px;height:48px;border-radius:50%;border:0;background:{{ s.btn }};color:#fff;cursor:pointer;font-size:16px;flex-shrink:0;display:grid;place-items:center\">{{ s.icon }}<\u002Fbutton>\n            <div style=\"min-width:0\"><b style=\"font-weight:700;font-size:17px;display:block;line-height:1.2\">{{ s.n }}<\u002Fb><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#4A6660\">{{ s.sub }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:flex-end;gap:2px;height:40px\">\n            <sc-for list=\"{{ s.bars }}\" as=\"b\" hint-placeholder-count=\"40\"><span style=\"flex:1;border-radius:2px;height:{{ b.h }};background:{{ b.c }};transition:background .15s\"><\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n          <p style=\"font-size:14.5px;color:#2A4A44\">{{ s.d }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;margin-top:12px\">\n      <div style=\"background:#F4F8F6;border-radius:12px;padding:12px 14px;font-size:15px\"><b>Clics y chasquidos:<\u002Fb> apertura mitral, prolapso, eyección.<\u002Fdiv>\n      <div style=\"background:#F4F8F6;border-radius:12px;padding:12px 14px;font-size:15px\"><b>Frote pericárdico:<\u002Fb> trifásico, «cuero nuevo»: pericarditis.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"focos\" style=\"padding-top:52px\">\n    <div style=\"display:flex;gap:16px;align-items:baseline;border-bottom:2px solid #04302B;padding-bottom:12px;margin-bottom:22px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:34px;color:#1D8446;line-height:1\">05<\u002Fspan>\n      <div><h2 style=\"font-size:clamp(25px,3.2vw,34px);font-weight:700\">Focos de auscultación<\u002Fh2><p style=\"color:#4A6660;font-size:15px\">Toca un foco para ver dónde está y qué soplos se oyen mejor ahí<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:24px;align-items:start\">\n      <div style=\"background:#fff;border:1px solid #D3E4DC;border-radius:18px;padding:18px\">\n        <div style=\"position:relative;max-width:340px;margin:0 auto;aspect-ratio:1/1.05;border:2px solid #04302B;border-radius:40% 40% 18% 18%;background:#F4F8F6;overflow:hidden\">\n          <div style=\"position:absolute;left:50%;top:0;bottom:0;width:0;border-left:2px dashed #9FC2B2\"><\u002Fdiv>\n          <div style=\"position:absolute;left:44%;top:4%;width:12%;height:62%;background:#E1EEE7;border-radius:8px\"><\u002Fdiv>\n          <div style=\"position:absolute;left:30%;top:20%;width:7%;height:0;border-top:1px solid #C9DCD2;width:40%\"><\u002Fdiv>\n          <div style=\"position:absolute;left:24%;top:34%;height:0;border-top:1px solid #C9DCD2;width:52%\"><\u002Fdiv>\n          <div style=\"position:absolute;left:22%;top:48%;height:0;border-top:1px solid #C9DCD2;width:56%\"><\u002Fdiv>\n          <div style=\"position:absolute;left:20%;top:62%;height:0;border-top:1px solid #C9DCD2;width:60%\"><\u002Fdiv>\n          <sc-for list=\"{{ focos }}\" as=\"f\" hint-placeholder-count=\"5\">\n            <button sc-camel-on-click=\"{{ f.pick }}\" aria-label=\"{{ f.n }}\" style=\"position:absolute;left:{{ f.x }};top:{{ f.y }};transform:translate(-50%,-50%);width:{{ f.sz }};height:{{ f.sz }};border-radius:50%;border:2px solid #fff;background:{{ f.bg }};color:#fff;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 2px 6px rgba(4,48,43,.3);transition:all .2s;display:grid;place-items:center\">{{ f.k }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"text-align:center;font-size:13px;color:#4A6660;margin-top:10px\">Vista anterior · derecha del paciente a la izquierda de la pantalla<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:8px;min-width:0\">\n        <sc-for list=\"{{ focos }}\" as=\"f\" hint-placeholder-count=\"5\">\n          <button sc-camel-on-click=\"{{ f.pick }}\" style=\"text-align:left;border:1px solid {{ f.bd }};background:{{ f.cardBg }};border-radius:12px;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start\">\n            <span style=\"width:32px;height:32px;border-radius:50%;background:{{ f.bg }};color:#fff;display:grid;place-items:center;font-weight:800\">{{ f.k }}<\u002Fspan>\n            <span><b style=\"font-weight:700;display:block\">{{ f.n }}<\u002Fb><span style=\"font-size:14.5px;color:#4A6660\">{{ f.w }}<\u002Fspan><span style=\"display:{{ f.show }};font-size:14.5px;color:#04302B;margin-top:4px\"><b style=\"color:#1D8446\">Se oye mejor:<\u002Fb> {{ f.v }}<\u002Fspan><\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"valvulopatias\" style=\"padding-top:52px\">\n    <div style=\"display:flex;gap:16px;align-items:baseline;border-bottom:2px solid #04302B;padding-bottom:12px;margin-bottom:22px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:34px;color:#1D8446;line-height:1\">06<\u002Fspan>\n      <div><h2 style=\"font-size:clamp(25px,3.2vw,34px);font-weight:700\">Valvulopatías<\u002Fh2><p style=\"color:#4A6660;font-size:15px\">Ocho lesiones cardinales · filtra, escucha y compara<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n        <sc-for list=\"{{ vf }}\" as=\"f\" hint-placeholder-count=\"5\">\n          <button sc-camel-on-click=\"{{ f.pick }}\" style=\"border:1px solid {{ f.bd }};background:{{ f.bg }};color:{{ f.fg }};padding:7px 14px;border-radius:999px;cursor:pointer;font-size:15px\">{{ f.t }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#4A6660\">↑ INSPIRACIÓN = DERECHAS · ↑ ESPIRACIÓN = IZQUIERDAS<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px;margin-top:16px;align-items:start\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px\">\n        <sc-for list=\"{{ valList }}\" as=\"v\" hint-placeholder-count=\"8\">\n          <button sc-camel-on-click=\"{{ v.pick }}\" style=\"text-align:left;border:1px solid {{ v.bd }};background:{{ v.bg }};color:{{ v.fg }};border-radius:12px;padding:11px 12px;cursor:pointer;min-height:70px;display:flex;flex-direction:column;justify-content:space-between;gap:4px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;opacity:.75\">{{ v.tag }}<\u002Fspan>\n            <b style=\"font-weight:600;font-size:15px;line-height:1.25\">{{ v.n }}<\u002Fb>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div id=\"valv-detalle\" style=\"background:#fff;border:1px solid #D3E4DC;border-radius:18px;padding:22px;min-width:0\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;color:#1D8446\">{{ val.tag }}<\u002Fdiv>\n        <h3 style=\"font-size:26px;font-weight:800;margin-top:4px\">{{ val.n }}<\u002Fh3>\n        <div style=\"margin-top:14px;background:#04302B;border-radius:14px;padding:14px 14px 10px\">\n          <div style=\"display:flex;align-items:flex-end;gap:2px;height:56px\">\n            <sc-for list=\"{{ valBars }}\" as=\"b\" hint-placeholder-count=\"40\"><span style=\"flex:1;border-radius:2px;height:{{ b.h }};background:{{ b.c }};transition:background .15s\"><\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:10% 35% 10% 45%;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#9FC2B2;margin-top:6px\"><span>R1<\u002Fspan><span>SÍSTOLE<\u002Fspan><span>R2<\u002Fspan><span>DIÁSTOLE<\u002Fspan><\u002Fdiv>\n          <button sc-camel-on-click=\"{{ val.play }}\" style=\"margin-top:10px;border:0;background:#3CC168;color:#04302B;font-weight:700;padding:9px 14px;border-radius:10px;cursor:pointer\">{{ val.label }}<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:6px;margin-top:14px\">\n          <sc-for list=\"{{ val.rows }}\" as=\"r\" hint-placeholder-count=\"7\">\n            <div style=\"display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;background:#F4F8F6;border-radius:10px;padding:10px 12px;font-size:15px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:#1D8446;padding-top:3px\">{{ r.0 }}<\u002Fspan><span>{{ r.1 }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"congenitas\" style=\"padding-top:52px\">\n    <div style=\"display:flex;gap:16px;align-items:baseline;border-bottom:2px solid #04302B;padding-bottom:12px;margin-bottom:22px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:34px;color:#1D8446;line-height:1\">07<\u002Fspan>\n      <div><h2 style=\"font-size:clamp(25px,3.2vw,34px);font-weight:700\">Cardiopatías congénitas<\u002Fh2><p style=\"color:#4A6660;font-size:15px\">Acianóticas (cortocircuito izquierda → derecha) y cianóticas (derecha → izquierda o mezcla)<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:inline-flex;gap:4px;background:#EAF6EE;padding:4px;border-radius:12px\">\n      <sc-for list=\"{{ cgTabs }}\" as=\"g\" hint-placeholder-count=\"2\">\n        <button sc-camel-on-click=\"{{ g.pick }}\" style=\"border:0;background:{{ g.bg }};box-shadow:{{ g.sh }};padding:8px 16px;border-radius:9px;cursor:pointer;font-weight:600;font-size:15px;color:#04302B\">{{ g.t }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:14px\">\n      <sc-for list=\"{{ cgList }}\" as=\"c\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ c.pick }}\" style=\"border:1px solid {{ c.bd }};background:{{ c.bg }};color:{{ c.fg }};padding:8px 14px;border-radius:999px;cursor:pointer;font-size:15px\">{{ c.ab }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"margin-top:14px;background:#fff;border:1px solid #D3E4DC;border-radius:18px;padding:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:22px\">\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;color:#1D8446\">{{ cg.type }}<\u002Fdiv>\n        <h3 style=\"font-size:24px;font-weight:800;margin-top:4px\">{{ cg.n }}<\u002Fh3>\n        <p style=\"margin-top:8px;color:#4A6660\">{{ cg.def }}<\u002Fp>\n        <div style=\"margin-top:14px;background:#FCEFD9;border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;background:#A8650A;color:#fff;padding:3px 8px;border-radius:6px;flex-shrink:0;margin-top:2px\">CLAVE<\u002Fspan><span style=\"font-size:15px\">{{ cg.key }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:6px;align-content:start\">\n        <sc-for list=\"{{ cg.rows }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <div style=\"display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;background:#F4F8F6;border-radius:10px;padding:10px 12px;font-size:15px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:#1D8446;padding-top:3px\">{{ r.0 }}<\u002Fspan><span>{{ r.1 }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"practica\" style=\"padding-top:52px\">\n    <div style=\"display:flex;gap:16px;align-items:baseline;border-bottom:2px solid #04302B;padding-bottom:12px;margin-bottom:22px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:34px;color:#1D8446;line-height:1\">08<\u002Fspan>\n      <div><h2 style=\"font-size:clamp(25px,3.2vw,34px);font-weight:700\">Practica<\u002Fh2><p style=\"color:#4A6660;font-size:15px\">Escucha y reconoce · casos clínicos · {{ quizLen }} preguntas<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #D3E4DC;border-radius:18px;padding:22px;max-width:820px\">\n      <sc-if value=\"{{ quizOn }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#4A6660\"><span>PREGUNTA {{ qn }} / {{ quizLen }}<\u002Fspan><span>ACIERTOS {{ score }}<\u002Fspan><\u002Fdiv>\n        <div style=\"height:6px;background:#EAF6EE;border-radius:99px;margin-top:8px;overflow:hidden\"><div style=\"height:100%;background:#3CC168;width:{{ qPct }};transition:width .3s\"><\u002Fdiv><\u002Fdiv>\n        <p style=\"font-size:19px;font-weight:600;margin-top:16px\">{{ qq.q }}<\u002Fp>\n        <sc-if value=\"{{ qq.au }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ qPlay }}\" style=\"margin-top:12px;border:0;background:#1D8446;color:#fff;font-weight:700;padding:12px 18px;border-radius:12px;cursor:pointer;display:flex;gap:10px;align-items:center\"><span style=\"width:10px;height:10px;border-radius:50%;background:{{ qDot }};animation:{{ qAnim }}\"><\u002Fspan>{{ qPlayLabel }}<\u002Fbutton>\n        <\u002Fsc-if>\n        <div style=\"display:grid;gap:8px;margin-top:14px\">\n          <sc-for list=\"{{ qOpts }}\" as=\"o\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ o.pick }}\" style=\"text-align:left;border:1px solid {{ o.bd }};background:{{ o.bg }};color:#04302B;border-radius:12px;padding:12px 14px;cursor:pointer;font-size:16px\">{{ o.t }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ answered }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:14px;background:#F4F8F6;border-radius:12px;padding:14px 16px;font-size:15.5px\"><b style=\"color:{{ fbColor }}\">{{ fbTitle }}<\u002Fb> {{ qq.why }}<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ nextQ }}\" style=\"margin-top:12px;border:0;background:#04302B;color:#F1F8F6;font-weight:700;padding:11px 18px;border-radius:12px;cursor:pointer\">{{ nextLabel }}<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ quizDone }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"text-align:center;padding:12px 0\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;color:#1D8446\">RESULTADO<\u002Fdiv>\n          <div style=\"font-size:56px;font-weight:800;color:#1D8446;line-height:1.1;margin-top:6px\">{{ score }}/{{ quizLen }}<\u002Fdiv>\n          <p style=\"color:#4A6660;margin-top:6px\">{{ doneMsg }}<\u002Fp>\n          <button sc-camel-on-click=\"{{ resetQ }}\" style=\"margin-top:16px;border:0;background:#04302B;color:#F1F8F6;font-weight:700;padding:11px 18px;border-radius:12px;cursor:pointer\">Repetir<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fmain>\n\n<footer style=\"background:#04302B;color:#DCEBE5\">\n  <div style=\"max-width:900px;margin:0 auto;padding:32px 16px;display:grid;gap:14px;justify-items:center;text-align:center\">\n    <p style=\"font-size:15px;line-height:1.6\">Herramienta de apoyo educativo para profesionales y estudiantes de la salud. No sustituye el juicio clínico ni la valoración individual de cada paciente.<\u002Fp>\n    <p style=\"font-size:13px;opacity:.75;max-width:80ch\">Referencias: Bickley LS. Bates. Guía de exploración física e historia clínica · Argente HA, Álvarez ME. Semiología médica · Surós J. Semiología médica y técnica exploratoria.<\u002Fp>\n    <p style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.04em;opacity:.85\">© 2026 MedON · Medicina interactiva<\u002Fp>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst NAV=[['inspeccion','Inspección'],['palpacion','Palpación'],['percusion','Percusión'],['auscultacion','Auscultación'],['focos','Focos'],['valvulopatias','Valvulopatías'],['congenitas','Congénitas'],['practica','Practica']];\n// Fonocardiograma de 40 barras: 0-3 R1, 4-17 sístole, 18-21 R2, 22-39 diástole\nfunction phono(type){const a=new Array(40).fill(4);const sp=(i,h)=>{a[i]=Math.max(a[i],h);};\n  [1,2].forEach(i=>sp(i,type==='em'?95:80));sp(0,40);sp(3,40);[19,20].forEach(i=>sp(i,type==='ea'?40:70));sp(18,35);sp(21,35);\n  if(type==='ea'||type==='ep'){for(let i=4;i<18;i++)sp(i,10+Math.round(55*(1-Math.abs(i-10.5)/7)));}\n  if(type==='im'||type==='it'){for(let i=4;i<18;i++)sp(i,48);}\n  if(type==='ia'){for(let i=22;i<34;i++)sp(i,Math.round(55-(i-22)*4));}\n  if(type==='em'||type==='et'){sp(23,55);for(let i=25;i<34;i++)sp(i,22+(i%2)*10);for(let i=34;i<40;i++)sp(i,28+(i-34)*7);}\n  if(type==='pm'){sp(10,70);for(let i=11;i<18;i++)sp(i,20+(i-11)*5);}\n  if(type==='r3'){sp(25,45);sp(26,30);}\n  if(type==='r4'){sp(37,45);sp(38,30);}\n  return a;}\nconst INS=[\n{g:'A',t:'Choque de punta',d:'A veces visible en sujetos delgados.',rows:[['Normal','5.º EIC, línea medioclavicular izquierda'],['Desplazado','Sugiere crecimiento ventricular: confírmalo palpando']]},\n{g:'A',t:'Abombamiento precordial',d:'Prominencia de la pared anterior del tórax.',rows:[['En la infancia','Cardiopatía congénita o crecimiento ventricular']]},\n{g:'A',t:'Latidos anormales',d:'Movimientos de la pared fuera del choque de punta.',rows:[['Impulso paraesternal','Hipertrofia del VD'],['Pulsación epigástrica','VD o aorta abdominal']]},\n{g:'A',t:'Cicatrices y dispositivos',d:'Orientan a cirugías y tratamientos previos.',rows:[['Esternotomía','Cirugía cardiaca previa'],['Toracotomía','Cirugía valvular o congénita'],['Bolsillo subclavicular','Marcapasos o desfibrilador']]},\n{g:'B',t:'Cianosis y acropaquia',d:'Busca en labios, lengua y lecho ungueal.',rows:[['Cianosis central','Cortocircuito derecha-izquierda, hipoxemia'],['Cianosis periférica','Bajo gasto, vasoconstricción'],['Acropaquia','Cardiopatía cianótica, endocarditis']]},\n{g:'B',t:'Ingurgitación yugular',d:'Paciente a 45°, observa la yugular interna derecha.',rows:[['Ingurgitación','Falla cardiaca derecha, taponamiento'],['Reflujo hepatoyugular','Presiona el hipocondrio derecho: la yugular sube y se mantiene']]},\n{g:'B',t:'Edema',d:'Fóvea en miembros inferiores; en encamados, región sacra.',rows:[['Bilateral con fóvea','Falla cardiaca derecha'],['Con ascitis','Congestión venosa sistémica avanzada']]},\n{g:'B',t:'Facies y piel',d:'Pistas de enfermedad valvular o metabólica.',rows:[['Facies mitral','Mejillas rojo-violáceas: estenosis mitral'],['Xantelasmas, arco corneal','Dislipidemia']]}];\nconst APQ=[{k:'loc',t:'Localización',o:[['n','5.º EIC, LMC'],['d','Abajo y afuera']]},{k:'ext',t:'Extensión',o:[['n','≤ 2,5 cm'],['d','> 2,5 cm']]},{k:'dur',t:'Duración e intensidad',o:[['n','Breve'],['d','Sostenido, enérgico']]}];\nconst FOC=[\n{k:'A',n:'Foco aórtico',w:'2.º EIC derecho, junto al borde esternal.',v:'estenosis aórtica.',x:'38%',y:'20%'},\n{k:'P',n:'Foco pulmonar',w:'2.º EIC izquierdo, junto al borde esternal.',v:'estenosis pulmonar, CIA (hiperflujo), ductus.',x:'62%',y:'20%'},\n{k:'E',n:'Foco de Erb (accesorio)',w:'3.er EIC izquierdo, borde esternal.',v:'insuficiencia aórtica.',x:'62%',y:'34%'},\n{k:'T',n:'Foco tricuspídeo',w:'4.º–5.º EIC izquierdo, borde esternal inferior.',v:'insuficiencia y estenosis tricuspídea, CIV.',x:'57%',y:'55%'},\n{k:'M',n:'Foco mitral (apexiano)',w:'5.º EIC izquierdo, línea medioclavicular.',v:'estenosis, insuficiencia y prolapso mitral.',x:'76%',y:'62%'}];\nconst VAL=[\n{k:'ea',n:'Estenosis aórtica',side:'i',ph:'s',f:'A',rows:[['ETIOLOGÍA','Degenerativa calcificada (ancianos), bicúspide (jóvenes), reumática.'],['FISIOPAT.','Obstrucción a la eyección del VI → hipertrofia concéntrica.'],['SOPLO','Sistólico de eyección, romboidal (crescendo-decrescendo), rudo.'],['FOCO','Aórtico (2.º EIC derecho).'],['IRRADIACIÓN','Cuello y carótidas.'],['MANIOBRAS','Aumenta en cuclillas; disminuye con Valsalva y de pie.'],['SIGNOS','Pulso parvus et tardus, R2 disminuido, frémito, R4. Tríada: angina, síncope, disnea.']]},\n{k:'ia',n:'Insuficiencia aórtica',side:'i',ph:'d',f:'E',rows:[['ETIOLOGÍA','Aguda: endocarditis, disección. Crónica: reumática, dilatación de raíz, bicúspide, Marfan.'],['FISIOPAT.','Reflujo diastólico → sobrecarga de volumen del VI → dilatación excéntrica.'],['SOPLO','Diastólico en decrescendo, aspirativo, de alta frecuencia. Puede haber Austin-Flint en ápex.'],['FOCO','Erb (3.er EIC izq.), sentado, inclinado, en espiración.'],['IRRADIACIÓN','Borde esternal izquierdo.'],['MANIOBRAS','Aumenta con hand-grip y cuclillas.'],['SIGNOS','Pulso céler (Corrigan), presión diferencial amplia. Musset, Quincke, Traube, Duroziez.']]},\n{k:'em',n:'Estenosis mitral',side:'i',ph:'d',f:'M',rows:[['ETIOLOGÍA','Reumática (la más frecuente), congénita, calcificación anular.'],['FISIOPAT.','Obstrucción al llenado del VI → ↑ presión auricular izq. → congestión pulmonar e HTP.'],['SOPLO','Retumbo diastólico de baja frecuencia con refuerzo presistólico.'],['FOCO','Ápex, con la campana, en decúbito lateral izquierdo.'],['IRRADIACIÓN','Escasa, muy localizado.'],['MANIOBRAS','Aumenta c romboidal, aumenta con la inspiración.'],['FOCO','Pulmonar (2.º EIC izq.).'],['IRRADIACIÓN','Hombro y región infraclavicular izquierda.'],['MANIOBRAS','Aumenta en inspiración.'],['SIGNOS','Clic de eyección, R2 con desdoblamiento amplio, impulso paraesternal.']]},\n{k:'et',n:'Estenosis tricuspídea',side:'d',ph:'d',f:'T',rows:[['ETIOLOGÍA','Reumática (casi siempre con lesión mitral), carcinoide.'],['FISIOPAT.','Obstrucción al llenado del VD → ↑ presión en AD y congestión sistémica.'],['SOPLO','Retumbo diastólico que aumenta con la inspiración.'],['FOCO','Tricuspídeo (borde esternal inferior izq.).'],['IRRADIACIÓN','Mínima, localizado.'],['MANIOBRAS','Aumenta en inspiración (Rivero-Carvallo +).'],['SIGNOS','Onda a prominente yugular, hepatomegalia, edema, ascitis.']]}];\nconst VF=[['all','Todas'],['s','Sistólicas'],['d','Diastólicas'],['i','Izquierdas'],['r','Derechas']];\nconst CG=[\n{c:'a',ab:'CIV',n:'Comunicación interventricular',def:'Defecto del tabique interventricular. La cardiopatía congénita más frecuente.',key:'A menor defecto, más intenso el soplo. Grandes defectos: falla cardiaca y riesgo de Eisenmenger.',rows:[['SOPLO','Holosistólico, rudo, intenso.'],['FOCO','Borde esternal izquierdo bajo (3.er–4.º EIC).'],['IRRADIACIÓN','«En rueda de carro» a todo el precordio.'],['SIGNOS','Frémito sistólico.']]},\n{c:'a',ab:'CIA',n:'Comunicación interauricular',def:'Defecto del tabique interauricular; el ostium secundum es el más común.',key:'Desdoblamiento fijo y amplio del R2: no varía con la respiración.',rows:[['SOPLO','Sistólico de eyección pulmonar por hiperflujo, no por el defecto.'],['FOCO','Pulmonar (2.º EIC izq.).'],['SIGNOS','Asintomática en la infancia; impulso paraesternal por sobrecarga del VD.']]},\n{c:'a',ab:'PCA',n:'Ductus arterioso persistente',def:'Persiste el conducto entre aorta y arteria pulmonar. Más común en prematuros.',key:'Soplo continuo «en maquinaria» (Gibson), sistodiastólico.',rows:[['FOCO','Infraclavicular izquierdo / 2.º EIC izq.'],['IRR s.state.prog)>.5)this.setState({cur:c,prog:p});};\n    addEventListener('scroll',this._s,{passive:true});this._s();\n    this._t=setInterval(()=>{const k=this.state.playing;if(!k)return;const a=document.getElementById('au-'+k);if(!a)return;if(a.ended||(a.paused&&Date.now()-(this._start||0)>1500)){this.setState({playing:null,pt:0});return;}this.setState({pt:a.duration?(a.currentTime*1.6)%1:0});},90);\n  }\n  componentWillUnmount(){removeEventListener('scroll',this._s);clearInterval(this._t);this.stop();}\n  stop(){document.querySelectorAll('audio').forEach(a=>{try{a.pause();if(a.readyState>0)a.currentTime=0;}catch(e){}});}\n  toggle(k){if(this.state.playing===k){this.stop();this.setState({playing:null,pt:0});return;}this.stop();const a=document.getElementById('au-'+k);if(!a)return;a.muted=false;a.volume=1;this._start=Date.now();const r=a.play();if(r&&r.catch)r.catch(()=>{try{a.load();a.play().catch(()=>{});}catch(e){}});this.setState({playing:k,pt:0});}\n  go(id){const e=document.getElementById(id);if(e)scrollTo({top:e.getBoundingClientRect().top+scrollY-100,behavior:'smooth'});}\n  sel(on){return on?{bg:D,fg:'#F1F8F6',bd:D}:{bg:'#fff',fg:D,bd:L};}\n  bars(type,k,dark){const on=this.state.playing===k,p=this.state.pt;return phono(type).map((h,i)=>({h:h+'%',c:on&&i/40<=p?'#3CC168':(dark?'#2F6B5C':(on?'#9FC2B2':'#C9DCD2'))}));}\n  renderVals(){\n    const s=this.state,set=o=>this.setState(o);\n    const nav=NAV.map(([id,t],i)=>({n:String(i+1).padStart(2,'0'),t,go:()=>this.go(id),fg:s.cur===id?D:'#4A6660',fw:s.cur===id?700:500,bar:s.cur===id?'#3CC168':'transparent'}));\n    const heroOn=s.playing==='r12';\n    const heroBars=phono('n').map((h,i)=>({h:h+'%',c:heroOn&&i/40<=s.pt?'#3CC168':'rgba(255,255,255,.28)'}));\n    const insp=INS.map((x,i)=>({g:x.g,t:x.t,...this.sel(i===s.ins),bg:i===s.ins?D:(s.seen[i]?S:'#fff'),seen:s.seen[i]?'✓':'',pick:()=>set({ins:i,seen:{...s.seen,[i]:1}})}));\n    const I=INS[s.ins],ins={...I,cat:I.g==='A'?'PRECORDIO':'SIGNO GENERAL'};\n    con .vf==='r'&&x.side==='d');\n    const list=VAL.filter(flt);\n    const vf=VF.map(([k,t])=>({t,...this.sel(k===s.vf),pick:()=>{const l=VAL.filter(x=>k==='all'||(k==='s'&&x.ph==='s')||(k==='d'&&x.ph==='d')||(k==='i'&&x.side==='i')||(k==='r'&&x.side==='d'));set({vf:k,val:l.some(x=>x.k===s.val)?s.val:l[0].k});}}));\n    const tag=x=>`${x.side==='i'?'IZQUIERDA':'DERECHA'} · ${x.ph==='s'?'SÍSTOLE':'DIÁSTOLE'}`;\n    const valList=list.map(x=>({n:x.n,tag:tag(x),...this.sel(x.k===s.val),pick:()=>set({val:x.k})}));\n    const V=VAL.find(x=>x.k===s.val),val={...V,tag:tag(V),play:()=>this.toggle(V.k),label:s.playing===V.k?'■ Detener':'▶ Escuchar soplo'};\n    const cgTabs=[['a','Acianóticas'],['c','Cianóticas']].map(([k,t])=>({t,bg:s.cg===k?'#fff':'transparent',sh:s.cg===k?'0 1px 4px rgba(4,48,43,.15)':'none',pick:()=>set({cg:k,cgi:0})}));\n    const cl=CG.filter(x=>x.c===s.cg);\n    const cgList=cl.map((x,i)=>({ab:x.ab,...this.sel(i===s.cgi),pick:()=>set({cgi:i})}));\n    const C=cl[s.cgi]||cl[0],cg={...C,type:C.c==='a'?'ACIANÓTICA · IZQ → DER':'CIANÓTICA · DER → IZQ'};\n    const qq=Q[s.qi],answered=s.pick!==null,qOn=qq.au&&s.playing===qq.au;\n    const qOpts=qq.o.map((t,i)=>{let bg='#fff',bd=L;if(answered){if(i===qq.a){bg=S;bd=G;}else if(i===s.pick){bg='#FBE4E1';bd='#B3261E';}}return{t,bg,bd,pick:()=>{if(s.pick!==null)return;set({pick:i,score:s.score+(i===qq.a?1:0)});}};});\n    const ok=answered&&s.pick===qq.a;\n    return {nav,prog:s.prog+'%',goVal:()=>this.go('valvulopatias'),goFoc:()=>this.go('focos'),goQuiz:()=>this.go('practica'),\n      heroBars,heroPlay:()=>this.toggle('r12'),heroLabel:heroOn?'Detener':'Escuchar R1 y R2',heroAnim:heroOn?'pulseDot .8s infinite':'none',\n      inspA:insp.filter(x=>x.g==='A'),inspB:insp.filter(x=>x.g==='B'),ins,apexQs,apex,heart,focos,vf,valList,val,valBars:this.bars(V.k,V.k,true),\n      cgTabs,cgList,cg,\n      quizOn:!s.done,quizDone:s.done,quizLen:Q.length,qn:s.qi+1,qPct:((s.qi+(answered?1:0))/Q.length*100)+'%',score:s.score,qq,qOpt
